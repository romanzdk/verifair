[project]
name = "verifair"
version = "0.2.0"
description = "Self-hosted review tool where coding agents publish change reports with evidence and people sign, comment on and approve them"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/romanzdk/verifair"
Repository = "https://github.com/romanzdk/verifair"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
docs = [
    "mkdocs-material>=9.8.0",
]
