[project]
name = "verifair"
version = "0.1.0"
description = "Review service for agent-written change-review reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.11.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]
license = "MIT"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
