name: Docs

on:
  push:
    branches: [main]
    paths: &docs-paths
      - README.md
      - CHANGELOG.md
      - docs/**
      - mkdocs.yml
      - docs_hooks.py
      - overrides/**
      - verifair/**
      - scripts/demo.py
      - scripts/snapshot-demo.sh
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  pull_request:
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # main runs queue instead, so a deploy is never cancelled halfway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The demo review on the site is a snapshot of a real verifair loaded with scripts/demo.py
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verifair
          POSTGRES_PASSWORD: verifair
          POSTGRES_DB: verifair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifair -d verifair"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv run --locked --only-group docs mkdocs build --strict
        env:
          # Hides the notice that Material for MkDocs reaches end of life on 2027-05-05 (successor: Zensical)
          NO_MKDOCS_2_WARNING: "1"
      - name: Add the static demo review to the site
        env:
          VERIFAIR_API_TOKEN: ci
          VERIFAIR_DATABASE_URL: postgresql://verifair:verifair@localhost:5432/verifair
        run: |
          uv run --locked --no-dev uvicorn verifair.asgi:app > uvicorn.log 2>&1 &
          for _ in $(seq 30); do curl -fs -o /dev/null http://localhost:8000/readyz && break; sleep 1; done
          python3 scripts/demo.py || { cat uvicorn.log; exit 1; }
          scripts/snapshot-demo.sh site/demo /verifair/demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
