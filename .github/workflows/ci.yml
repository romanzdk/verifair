name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verifair
          POSTGRES_PASSWORD: verifair
          POSTGRES_DB: verifair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifair -d verifair"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      VERIFAIR_TEST_DATABASE_URL: postgresql://verifair:verifair@localhost:5432/verifair
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      # tests/test_js.py runs the browser anchor helpers with Node and skips without it
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
