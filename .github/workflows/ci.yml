name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verifair
          POSTGRES_PASSWORD: verifair
          POSTGRES_DB: verifair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifair -d verifair"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      VERIFAIR_TEST_DATABASE_URL: postgresql://verifair:verifair@localhost:5432/verifair
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
      # tests/test_js.py runs the browser anchor helpers with Node and skips without it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verifair
          POSTGRES_PASSWORD: verifair
          POSTGRES_DB: verifair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifair -d verifair"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: verifair:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for /readyz
        run: |
          # Kubernetes runAsNonRoot only accepts a numeric user
          test "$(docker image inspect -f '{{.Config.User}}' verifair:ci)" = 10001
          docker run -d --name verifair --network host --read-only --tmpfs /tmp \
            -e VERIFAIR_API_TOKEN=ci \
            -e VERIFAIR_DATABASE_URL=postgresql://verifair:verifair@localhost:5432/verifair \
            verifair:ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:8000/readyz && exit 0
            sleep 1
          done
          docker logs verifair
          exit 1

  publish:
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only publish v1.2.3 tags on commits in main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      # A slower run for an older commit must not move the main tag back
      - id: head
        run: echo "newest=$([ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,enable=${{ steps.head.outputs.newest }}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public images are built from scratch, never from a cache other jobs can write
          no-cache: true
