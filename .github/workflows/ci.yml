name: CI

on:
  # Dependabot branches are tested by their pull request, so skip the duplicate push run
  push:
    branches-ignore: ["dependabot/**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: verifair
          POSTGRES_PASSWORD: verifair
          POSTGRES_DB: verifair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifair -d verifair"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      VERIFAIR_TEST_DATABASE_URL: postgresql://verifair:verifair@localhost:5432/verifair
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      # tests/test_js.py runs the browser anchor helpers with Node and skips without it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # The skill's prompt exporter runs on the author's own python3; macOS still ships 3.9
      - name: Run the prompt exporter on Python 3.9
        run: |
          printf '%s\n' '{"type": "user", "message": {"content": "Fix the login."}}' > "$RUNNER_TEMP/session.jsonl"
          uv run --no-project --python 3.9 python -I skills/verifair-review/export-prompts.py "$RUNNER_TEMP/session.jsonl" | grep -q "> Fix the login."
          printf '%s\n' '{' '"info": {"id": "ses_ci"},' '"messages": [{"id": "msg_1", "type": "user", "text": "Fix the logout."}]' '}' > "$RUNNER_TEMP/session.json"
          uv run --no-project --python 3.9 python -I skills/verifair-review/export-prompts.py "$RUNNER_TEMP/session.json" | grep -q "> Fix the logout."

  upgrade:
    name: upgrade from the last release (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: verifair
          POSTGRES_PASSWORD: verifair
          POSTGRES_DB: verifair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifair -d verifair"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --no-dev
      # Self-hosters upgrade with their data in place: what the last release wrote must still read the same
      - name: Load the last release's demo, then read it back with this code
        env:
          VERIFAIR_API_TOKEN: ci
          VERIFAIR_DATABASE_URL: postgresql://verifair:verifair@localhost:5432/verifair
        run: |
          set -o pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^)"
          echo "Upgrading from $prev"
          mkdir "$RUNNER_TEMP/old"
          git archive "$prev" scripts docs | tar -x -C "$RUNNER_TEMP/old"
          demo="$RUNNER_TEMP/old/scripts/demo.py"
          ready() { for _ in $(seq 60); do curl -fs -o /dev/null http://localhost:8000/readyz && return; sleep 1; done; return 1; }
          # the old release reads today's variable names, so renaming one needs a fallback here
          docker run -d --name old --network host -e VERIFAIR_API_TOKEN -e VERIFAIR_DATABASE_URL "ghcr.io/${{ github.repository }}:${prev#v}"
          ready || { docker logs old; exit 1; }
          {
            python3 "$demo" &&
            python3 scripts/upgrade-check.py seed "$demo" &&
            python3 scripts/upgrade-check.py snapshot "$demo" > "$RUNNER_TEMP/before.json"
          } || { docker logs old; exit 1; }
          docker rm -f old
          uv run --locked --no-dev uvicorn verifair.asgi:app > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          ready || { cat "$RUNNER_TEMP/uvicorn.log"; exit 1; }
          python3 scripts/upgrade-check.py compare "$demo" "$RUNNER_TEMP/before.json" || { cat "$RUNNER_TEMP/uvicorn.log"; exit 1; }
      - name: The upgraded schema matches a fresh one
        run: |
          set -o pipefail
          base=postgresql://verifair:verifair@localhost:5432
          dump() { docker run --rm --network host "postgres:${{ matrix.postgres }}" pg_dump --schema-only --no-owner --no-privileges "$base/$1" | grep -v -e '^--' -e '^$' -e '^\\'; }
          docker run --rm --network host "postgres:${{ matrix.postgres }}" psql "$base/verifair" -qc "CREATE DATABASE fresh"
          uv run --locked --no-dev python - "$base/fresh" <<'EOF'
          import sys
          from verifair import db
          with db.connect(sys.argv[1]) as conn:
              db.init_schema(conn)
          EOF
          dump verifair > "$RUNNER_TEMP/upgraded.sql"
          dump fresh > "$RUNNER_TEMP/fresh.sql"
          diff "$RUNNER_TEMP/upgraded.sql" "$RUNNER_TEMP/fresh.sql"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Kustomize manifests and check them against the Kubernetes schema
        working-directory: deploy/kustomize/example
        run: |
          printf 'VERIFAIR_API_TOKEN=ci\n' > secrets.env
          printf 'POSTGRES_PASSWORD=ci\n' > db.env
          sed -i 's|# - ingress.yaml|- ingress.yaml|' kustomization.yaml
          kubectl kustomize . | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c -strict -summary

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verifair
          POSTGRES_PASSWORD: verifair
          POSTGRES_DB: verifair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifair -d verifair"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: verifair:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for /readyz
        run: |
          # Kubernetes runAsNonRoot only accepts a numeric user
          test "$(docker image inspect -f '{{.Config.User}}' verifair:ci)" = 10001
          docker run -d --name verifair --network host --read-only --tmpfs /tmp \
            -e VERIFAIR_API_TOKEN=ci \
            -e VERIFAIR_DATABASE_URL=postgresql://verifair:verifair@localhost:5432/verifair \
            verifair:ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:8000/readyz && exit 0
            sleep 1
          done
          docker logs verifair
          exit 1

  publish:
    needs: [image, upgrade]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only publish v1.2.3 tags on commits in main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      # A slower run for an older commit must not move the main tag back
      - id: head
        run: echo "newest=$([ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,enable=${{ steps.head.outputs.newest }}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public images are built from scratch, never from a cache other jobs can write
          no-cache: true

  release:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # a re-run after a failed later step must not fail on the release made the first time
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          section="$(python3 scripts/changelog_section.py "${TAG#v}")"
          [ -n "$section" ] || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          printf '%s\n\n**Docker image:** `ghcr.io/%s:%s` · **Agent skill:** `npx skills add %s@%s --skill verifair-review -g`\n\n**Full diff:** https://github.com/%s/compare/%s\n' \
            "$section" "$GITHUB_REPOSITORY" "${TAG#v}" "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_REPOSITORY" \
            "$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "$TAG")...$TAG" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
