<form class="name-prompt" method="post" action="/me">
  <p><b>Set your name</b> so others know who is commenting.</p>
  {% if name_error %}<p class="error">Enter a name (1–60 characters).</p>{% endif %}
  <input name="name" maxlength="60" required placeholder="Your name" aria-label="Your name" autofocus>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn p">Save</button>
</form>
