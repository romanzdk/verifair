<form class="verdict" id="vf_verdict" hx-post="{{ url }}/verdict" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="#vf_verdict button"{% if verdict_oob %} hx-swap-oob="true"{% endif %}>
  <div class="vmsg" aria-live="polite">
    {% if my_verdict %}<p class="mine" role="alert">{{ "You approved" if my_verdict.verdict == "approve" else "You requested changes on" }} v{{ current_version }}</p>{% endif %}
    {% if self_review %}<p class="note">{{ self_review }}</p>{% endif %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  </div>
  <input type="hidden" name="version" value="{{ version }}">
  <textarea name="summary" maxlength="2000" placeholder="Summary for the author (optional)" aria-label="Summary for the author"{% if self_review %} disabled{% endif %}>{{ summary or "" }}</textarea>
  <button class="btn" name="verdict" value="request_changes"{% if self_review %} disabled{% endif %}>Request changes</button>
  <button class="btn p" name="verdict" value="approve"{% if self_review %} disabled{% endif %}>Approve</button>
</form>
