apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifair
  labels:
    app.kubernetes.io/name: verifair
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: verifair
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verifair
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifair
          image: ghcr.io/romanzdk/verifair:0.11.0
          envFrom:
            - configMapRef:
                name: verifair-config
            - secretRef:
                name: verifair-secrets
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            # Ingress controllers keep sending requests to a stopping pod for a few seconds
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            # uv run writes to /tmp at start
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
