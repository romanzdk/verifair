apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verifair-db
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: verifair-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: verifair
      ports:
        - port: postgres
