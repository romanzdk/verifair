apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: verifair-db
  labels:
    app.kubernetes.io/name: verifair-db
spec:
  serviceName: verifair-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: verifair-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verifair-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        # the postgres user of the official image
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
          env:
            - name: POSTGRES_USER
              value: verifair
            - name: POSTGRES_DB
              value: verifair
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verifair-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, verifair, -d, verifair]
            timeoutSeconds: 5
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
