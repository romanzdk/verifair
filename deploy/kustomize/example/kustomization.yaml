apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: verifair
resources:
  - namespace.yaml
  - ../base
  # Only together with sign-in (shared mode), see docs/deployment.md#run-it-for-a-team
  # - ingress.yaml
components:
  # Remove to use your own Postgres, and put VERIFAIR_DATABASE_URL in secrets.env instead
  - ../postgres
configMapGenerator:
  - name: verifair-config
    literals:
      - VERIFAIR_BASE_URL=http://localhost:8000
secretGenerator:
  - name: verifair-secrets
    envs:
      - secrets.env
  # Remove together with ../postgres
  - name: verifair-db
    envs:
      - db.env
