apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verifair
spec:
  # ingressClassName: nginx
  tls:
    - hosts: [verifair.example.com]
      secretName: verifair-tls
  rules:
    - host: verifair.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: verifair
                port:
                  name: http
