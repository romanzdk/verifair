services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: verifair
      POSTGRES_PASSWORD: verifair
      POSTGRES_DB: verifair
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifair -d verifair"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
