services:
  db:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: verifair
      POSTGRES_PASSWORD: verifair
      POSTGRES_DB: verifair
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U verifair -d verifair"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VERIFAIR_DATABASE_URL: postgresql://verifair:verifair@db:5432/verifair
      VERIFAIR_API_TOKEN: ${VERIFAIR_API_TOKEN:-change-me}

volumes:
  pgdata:
